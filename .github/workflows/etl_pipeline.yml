name: AgriYield Punjab ETL & Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run Irrigation & DES Crop ETL parsers
        run: |
          python -m etl.parse_irrigation --raw-dir data/raw --out-dir data/processed
          python -m etl.parse_des_crops --input-file "data/raw/horizontal_crop_vertical_year_report (1).xls" --out-dir data/processed

      - name: Commit processed CSV datasets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/*.csv
          git diff --staged --quiet || git commit -m "chore(etl): update processed irrigation and DES crop CSVs"
          git push
